[tool.poetry]
name = "risklence-tower"
version = "0.1.0"
description = "AI-enabled compliance and risk monitoring platform for multi-cloud environments"
authors = ["Risklence Team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"

# Web Framework & API
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"

# CLI
click = "^8.1.7"
rich = "^13.7.0"

# Database
sqlalchemy = "^2.0.23"
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9"
pymongo = "^4.6.0"

# Azure Connectors
azure-identity = "^1.15.0"
azure-mgmt-resource = "^23.0.1"
azure-mgmt-compute = "^30.4.0"
azure-mgmt-network = "^25.2.0"
azure-mgmt-storage = "^21.1.0"
azure-mgmt-security = "^6.0.0"
azure-mgmt-monitor = "^6.0.2"
azure-mgmt-subscription = "^3.1.1"
msrestazure = "^0.6.4"

# AWS Connectors
boto3 = "^1.34.0"
botocore = "^1.34.0"

# Security & Vulnerability Scanning
bandit = "^1.7.5"
safety = "^3.0.0"

# Compliance & Standards
pyyaml = "^6.0.1"
jsonschema = "^4.20.0"
jmespath = "^1.0.1"

# Threat Intelligence
stix2 = "^3.0.1"
taxii2-client = "^2.3.0"
mitreattack-python = "^3.0.3"

# Jira Integration
jira = "^3.6.0"

# Reporting
jinja2 = "^3.1.2"
weasyprint = "^60.1"
matplotlib = "^3.8.2"
pandas = "^2.1.4"
plotly = "^5.18.0"

# Caching & Task Queue
redis = "^5.0.1"
hiredis = "^2.3.2"
celery = "^5.3.4"
kombu = "^5.3.4"

# Utilities
python-dotenv = "^1.0.0"
requests = "^2.31.0"
httpx = "^0.25.2"
tenacity = "^8.2.3"
cryptography = "^50.0.0"
python-dateutil = "^2.8.2"
defusedxml = "^0.7.1"

# Authentication
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
python-multipart = ">=0.0.20,<0.1.0"

# AI Providers (optional - install only what you need)
anthropic = {version = "^0.25.0", optional = true}
openai = {version = "^1.12.0", optional = true}
google-generativeai = {version = "^0.3.0", optional = true}

# Monitoring & Logging
prometheus-client = "^0.19.0"
structlog = "^24.1.0"
email-validator = "^2.3.0"

[tool.poetry.extras]
# AI provider extras - install only what you need
claude = ["anthropic"]
openai = ["openai"]
gemini = ["google-generativeai"]
all-ai = ["anthropic", "openai", "google-generativeai"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
black = "^23.12.0"
ruff = "^0.1.8"
mypy = "^1.7.1"
pre-commit = "^3.6.0"
moto = "^4.2.11"
azure-devtools = "^1.2.0"

[tool.poetry.scripts]
risklence = "src.cli.main:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing --cov-report=html"
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (slower)",
    "e2e: marks tests as end-to-end tests (slowest)",
    # #251 — moved here from the deleted repo-root `tests/` (#228). They ran in no
    # workflow for months and their expectations no longer match the product:
    # `/dashboard` became `/setup`, `review_baseline` became
    # `review_proposed_business_model`, a whole next-steps list changed. Which side
    # is wrong is a product question per case, and answering it by editing whichever
    # is easier to change is how a test suite stops meaning anything — so they are
    # named, counted and excluded from CI rather than rewritten to agree with the
    # code. Deleting a marker is the unit of work in #251.
    "unreconciled: expectation not yet reconciled with current behaviour (#251)",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
